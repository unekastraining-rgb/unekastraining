<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    @keyframes float { 0%,100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-8px); opacity: .6; } }
